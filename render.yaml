services:
  - type: web
    name: haro-sensor-placement
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app.backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
    plan: free
